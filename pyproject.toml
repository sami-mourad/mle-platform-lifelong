[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mle-platform-lifelong"
version = "0.1.0"
description = "Contract-first MLE platform with a bounded SynthAML hosting proof"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{name = "Sami Mourad"}]
keywords = [
  "machine-learning-engineering",
  "ml-infrastructure",
  "mlops",
  "feature-store",
  "model-serving",
  "fraud-detection",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.137,<1",
  "joblib>=1.5,<2",
  "numpy>=1.22,<3",
  "pandas>=2.2,<3",
  "prometheus-client>=0.22,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.8,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.urls]
Homepage = "https://github.com/sami-mourad/mle-platform-lifelong"
Repository = "https://github.com/sami-mourad/mle-platform-lifelong"
Issues = "https://github.com/sami-mourad/mle-platform-lifelong/issues"
Documentation = "https://github.com/sami-mourad/mle-platform-lifelong/tree/main/docs"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.18,<2",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
  "types-pyyaml>=6.0,<7",
]
synthaml-core = [
  "pyarrow>=20,<26",
]
synthaml-sdk = [
  "bentoml>=1.4,<2",
  "cryptography>=45,<48",
  "evidently>=0.7,<0.8",
  "feast>=0.64,<0.65",
  "mlflow>=3.14,<4",
  "polars>=1.42,<2",
  "pyarrow>=20,<26",
]
orchestration = [
  "dagster>=1.13,<2",
  "dagster-postgres>=0.29,<1",
  "dagster-webserver>=1.13,<2",
]
infra = [
  "boto3>=1.40,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=7,<9",
]
full-platform = [
  "bentoml>=1.4,<2",
  "boto3>=1.40,<2",
  "cryptography>=45,<48",
  "dagster>=1.13,<2",
  "dagster-postgres>=0.29,<1",
  "dagster-webserver>=1.13,<2",
  "evidently>=0.7,<0.8",
  "feast>=0.64,<0.65",
  "mlflow>=3.14,<4",
  "polars>=1.42,<2",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=20,<26",
  "redis>=7,<9",
]

[project.scripts]
mle-train = "mle_platform.projects.dummy_imbalance.train:main"
mle-serve = "mle_platform.projects.dummy_imbalance.service:main"
mle-audit = "mle_platform.cli:audit_main"
synthaml-serve = "mle_platform.projects.synthaml.service:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mle_platform*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests that train models or cross process boundaries",
  "contract: API or artifact contract tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["infra/"]

[[tool.mypy.overrides]]
module = [
  "bentoml.*",
  "dagster.*",
  "evidently.*",
  "feast.*",
  "joblib.*",
  "mlflow.*",
  "pandas.*",
  "polars.*",
  "sklearn.*",
  "temporal_mle.*",
  "yaml",
  "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mle_platform.orchestration.*"]
disallow_untyped_decorators = false
warn_return_any = false
